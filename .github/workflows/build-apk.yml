name: Build No Bars Connect APK

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Apply No Bars Connect branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s)

          replace('android/app/src/main/AndroidManifest.xml', [
              ('android:label="MeshCore Open"', 'android:label="No Bars Connect"'),
              ('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/no_bars_launcher"'),
          ])

          replace('lib/main.dart', [
              ("title: 'MeshCore Open'", "title: 'No Bars Connect'"),
          ])

          replace('lib/theme/mesh_theme.dart', [
              ('MeshCore palette — high-contrast slate surfaces with sky-blue accents.', 'No Bars Club palette — near-black surfaces with bronze and olive accents.'),
              ('0xFF0B1220', '0xFF080B0A'),
              ('0xFF0F172A', '0xFF0E120F'),
              ('0xFF162033', '0xFF151A16'),
              ('0xFF1E293B', '0xFF1C221D'),
              ('0xFF334155', '0xFF2A302B'),
              ('0xFF2A3850', '0xFF34362F'),
              ('0xFF3B4A61', '0xFF4A4B40'),
              ('0xFF546376', '0xFF66675B'),
              ('0xFFF8FAFC', '0xFFEEE9DC'),
              ('0xFFD5DEE9', '0xFFD8D1C2'),
              ('0xFFAAB6C6', '0xFFB4AC9D'),
              ('0xFF828FA3', '0xFF8F887B'),
              ('0xFF0EA5E9', '0xFF9A6F35'),
              ('0xFF0284C7', '0xFF7B572A'),
              ('0x290EA5E9', '0x299A6F35'),
              ('0x800EA5E9', '0x809A6F35'),
              ('0xFFDE7FDB', '0xFF7F8F6A'),
              ('0x1CDE7FDB', '0x1C7F8F6A'),
              ('0x47DE7FDB', '0x477F8F6A'),
              ('0xFF0C4A6E', '0xFF3F3526'),
              ('0xFF0369A1', '0xFF9A6F35'),
              ('0xFFF0F9FF', '0xFFEEE9DC'),
              ('0xFF2F6EA8', '0xFF8A642F'),
              ('0xFF2563EB', '0xFF7F8F6A'),
              ('0xFF7C3AED', '0xFF9A6F35'),
              ('0xFFF97316', '0xFF9A6F35'),
              ('0xFF0F766E', '0xFF7F8F6A'),
              ('0xFF38BDF8', '0xFF9A6F35'),
          ])
          PY

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#080B0A</color>
              <color name="no_bars_bronze">#9A6F35</color>
              <color name="no_bars_cream">#EEE9DC</color>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/no_bars_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080B0A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#9A6F35" android:pathData="M18,22h72v8h-72zM18,38h28v8h-28zM62,38h28v8h-28zM18,54h28v8h-28zM62,54h28v8h-28zM18,70h72v8h-72z"/>
              <path android:fillColor="#EEE9DC" android:pathData="M50,36h8v28h-8z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#080B0A" />
              <item android:gravity="center">
                  <shape android:shape="rectangle">
                      <size android:width="116dp" android:height="48dp" />
                      <solid android:color="#080B0A" />
                      <stroke android:width="2dp" android:color="#9A6F35" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Prepare No Bars Connect artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/No-Bars-Connect-arm64-v8a.apk
          cd dist
          sha256sum No-Bars-Connect-arm64-v8a.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: No-Bars-Connect-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
