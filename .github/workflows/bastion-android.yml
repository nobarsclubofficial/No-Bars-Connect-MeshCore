name: Bastion Android APK

on:
  push:
    branches: [bastion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Bastion branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('lib').rglob('*.dart'):
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              branded = text.replace('MeshCore Open', 'Bastion').replace('meshcore_open', 'bastion')
              if branded != text:
                  path.write_text(branded, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="MeshCore Open"', 'android:label="Bastion"')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Generate Bastion launcher artwork
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          W=1024; H=1024
          bg=(17,20,24); cyan=(24,211,211); white=(245,247,248)
          px=[list(bg) for _ in range(W*H)]
          def rect(x0,y0,x1,y1,c):
              for y in range(max(0,y0),min(H,y1)):
                  base=y*W
                  for x in range(max(0,x0),min(W,x1)): px[base+x]=list(c)
          # cyan border
          rect(70,70,954,105,cyan); rect(70,919,954,954,cyan); rect(70,70,105,954,cyan); rect(919,70,954,954,cyan)
          # fortress body and towers
          rect(260,390,764,735,white); rect(220,300,355,735,white); rect(669,300,804,735,white)
          # battlement cutouts
          for x in (255,315,375,435,495,555,615,675,735): rect(x,300,x+32,390,bg)
          # arched-ish doorway
          rect(455,575,569,735,bg)
          for yy in range(535,576):
              half=int(((57*57-(yy-575)*(yy-575)) if 57*57-(yy-575)*(yy-575)>0 else 0)**0.5)
              rect(512-half,yy,512+half,yy+1,bg)
          raw=bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W): raw.extend(px[y*W+x])
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          Path('bastion-launcher.png').write_bytes(data)
          PY

      - name: Force launcher icon config and generate icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text()
          s=s.replace('image_path: "mesh-icon.png"','image_path: "bastion-launcher.png"')
          s=s.replace('adaptive_icon_background: "#9F9D95"','adaptive_icon_background: "#111418"')
          s=s.replace('adaptive_icon_foreground: "assets/icons/ic_foreground.png"','adaptive_icon_foreground: "bastion-launcher.png"')
          p.write_text(s)
          PY
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Bastion APK
        run: flutter build apk --release --target lib/main.dart

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Bastion-Build4-Branding-arm64.apk

      - name: Upload Bastion APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Build4-Branding-APK
          path: dist/Bastion-Build4-Branding-arm64.apk
          if-no-files-found: error
          retention-days: 30
