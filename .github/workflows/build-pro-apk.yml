name: Build NO BARS PRO APK

on:
  push:
    branches: [no-bars-pro]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-pro-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-pro-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pro-
            ${{ runner.os }}-gradle-

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Apply NO BARS PRO branding and launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Rebrand product UI while deliberately preserving upstream attribution text.
          for root in [Path('lib'), Path('android/app/src/main')]:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.dart', '.xml', '.arb', '.json', '.kt', '.java'}:
                      continue
                  try:
                      s = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  keep = 'Built on MeshCore Open with upstream attribution preserved.'
                  token = '__NO_BARS_UPSTREAM_ATTRIBUTION__'
                  s = s.replace(keep, token)
                  s = s.replace('MeshCore Open', 'NO BARS PRO').replace('Mesh Open', 'NO BARS PRO')
                  s = s.replace(token, keep)
                  p.write_text(s)

          theme = Path('lib/theme/mesh_theme.dart')
          s = theme.read_text()
          pairs = [
              ('0xFF0B1220','0xFF090B10'),('0xFF0F172A','0xFF121722'),('0xFF162033','0xFF181F2C'),
              ('0xFF1E293B','0xFF1E2633'),('0xFF334155','0xFF27364B'),('0xFFF8FAFC','0xFFF5F7FB'),
              ('0xFFD5DEE9','0xFFC1CAD8'),('0xFFAAB6C6','0xFFA8B3C7'),('0xFF828FA3','0xFF7F8CA1'),
              ('0xFF0EA5E9','0xFFFF1493'),('0xFF0284C7','0xFF00A6FF'),('0xFFDE7FDB','0xFFFFD400'),
              ('0xFF38BDF8','0xFF00A6FF'),('0xFF2563EB','0xFF00A6FF'),('0xFF7C3AED','0xFFFF1493'),('0xFFF97316','0xFFFFD400')
          ]
          for old,new in pairs: s=s.replace(old,new)
          theme.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]*"', 'android:label="NO BARS PRO"', m, count=1)
          m = re.sub(r'android:icon="@[^"]+"', 'android:icon="@mipmap/ic_launcher"', m, count=1)
          m = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', m, count=1)
          manifest.write_text(m)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('applicationId = "com.meshcore.meshcore_open"', 'applicationId = "com.nobarsclub.pro"')
          g = g.replace('applicationId = "com.nobarsclub.connect.enhanced"', 'applicationId = "com.nobarsclub.pro"')
          gradle.write_text(g)

          main = Path('lib/main.dart')
          ms = main.read_text()
          ms = ms.replace("import 'screens/scanner_screen.dart';", "import 'screens/no_bars_pro_screen.dart';")
          ms = ms.replace("title: 'MeshCore Open'", "title: 'NO BARS PRO'")
          ms = ms.replace("title: 'No Bars Connect Enhanced'", "title: 'NO BARS PRO'")
          ms = ms.replace(': const ScannerScreen(),', ': const NoBarsProScreen(),')
          main.write_text(ms)
          PY

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#090B10</color></resources>
          EOF

          # Use the dedicated corrected PRO artwork, not the generic/old launcher source.
          cp branding/pro-icon-final.svg /tmp/no-bars-pro.svg
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/drawable-nodpi

          convert -background '#090B10' /tmp/no-bars-pro.svg -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -background '#090B10' /tmp/no-bars-pro.svg -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -background '#090B10' /tmp/no-bars-pro.svg -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -background '#090B10' /tmp/no-bars-pro.svg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -background '#090B10' /tmp/no-bars-pro.svg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          convert -size 720x1280 xc:'#090B10' \
            \( /tmp/no-bars-pro.svg -resize 320x320 \) -gravity center -geometry +0-150 -composite \
            -font DejaVu-Sans-Bold -pointsize 58 -fill '#F5F7FB' -gravity center -annotate +0+110 'NO BARS PRO' \
            -font DejaVu-Sans -pointsize 27 -fill '#00A6FF' -gravity center -annotate +0+175 'Connect Beyond Coverage.' \
            android/app/src/main/res/drawable-nodpi/no_bars_pro_splash.png

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><color android:color="#090B10" /></item>
            <item android:gravity="fill"><bitmap android:gravity="fill" android:src="@drawable/no_bars_pro_splash" /></item>
          </layer-list>
          EOF
          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml

          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'Built on MeshCore Open with upstream attribution preserved.' lib/screens/no_bars_pro_screen.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze PRO additions
        run: flutter analyze lib/screens/no_bars_pro_screen.dart lib/screens/pro_network_intelligence_screen.dart lib/main.dart

      - name: Build PRO ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub --build-name 9.5.0-pro.2 --build-number 19

      - name: Prepare PRO artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NO-BARS-PRO-arm64-v8a.apk
          cd dist
          sha256sum NO-BARS-PRO-arm64-v8a.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload PRO Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NO-BARS-PRO-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
